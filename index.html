body:not(.tv-playing) #tv-hud { display: none !important; }
#tv-splash { font-family: var(--font-ui); position: fixed; inset: 0; z-index: 2147483000; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; background: linear-gradient(#fbeecb, #f1d9a0); color: #7a4b22; font-family: 'Baloo 2', system-ui, sans-serif; transition: opacity .35s; }
#tv-splash.out { opacity: 0; pointer-events: none; }
#tv-splash .sp-logo { font-size: 44px; font-weight: 800; line-height: 1; letter-spacing: .5px; text-align: center; }
#tv-splash .sp-logo span { display: block; color: #5c9a3c; }
#tv-splash .sp-txt { font-size: 18px; font-weight: 700; opacity: .85; }
#tv-splash .sp-txt { position: fixed; left: 0; right: 0; bottom: calc(46px + env(safe-area-inset-bottom, 0px)); text-align: center; text-shadow: 0 1px 0 rgba(255,255,255,.7); }
#tv-splash .sp-bar { position: fixed; left: 50%; bottom: calc(22px + env(safe-area-inset-bottom, 0px)); width: min(72vw, 340px); height: 14px; transform: translateX(-50%); box-sizing: border-box; border: 3px solid #5b3a29; border-radius: 10px; background: #fff1d0; box-shadow: 0 3px 0 rgba(91,58,41,.3); overflow: hidden; }
#tv-splash .sp-bar i { display: block; width: 100%; height: 100%; border-radius: 6px; background: linear-gradient(#a9e07c, #7cc24f); transform: scaleX(0); transform-origin: 0 50%; transition: transform .25s ease-out; }
#tv-garden-bar { position: fixed; left: 50%; bottom: calc(88px + env(safe-area-inset-bottom, 0px)); z-index: 2147483001; transform: translateX(-50%); display: flex; gap: 6px; padding: 5px 8px; background: #fff4d9; border: 3px solid #5b3a29; border-radius: 999px; box-shadow: 0 4px 0 rgba(91,58,41,.32); transition: opacity .3s ease-out, transform .3s ease-out; }
#tv-garden-bar.off { opacity: 0; visibility: hidden; pointer-events: none; transform: translate(-50%, 12px); transition: opacity .3s ease-out, transform .3s ease-out, visibility 0s .3s; }
#tv-garden-bar button { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-width: 64px; min-height: 52px; padding: 2px 6px; border: 0; border-radius: 999px; background: transparent; color: #4a2f1a; font: 700 12px/1 var(--font-d, 'Baloo 2', system-ui, sans-serif); cursor: pointer; -webkit-tap-highlight-color: transparent; transition: transform .12s ease-out; }
#tv-garden-bar button:active { transform: scale(.94); } #tv-garden-bar button.on { background: #ffdc85; box-shadow: inset 0 0 0 3px #d6922a; } #tv-garden-bar svg { width: 26px; height: 26px; display: block; }
@media (max-height: 460px) { #tv-garden-bar { left: auto; right: calc(12px + env(safe-area-inset-right, 0px)); bottom: auto; top: 50%; flex-direction: column; border-radius: 30px; transform: translateY(-50%); } #tv-garden-bar.off { transform: translate(12px, -50%); } }
body.tv-bg3d #tv-splash { background: transparent; }
body.tv-bg3d #tv-splash .sp-logo { text-shadow: 0 3px 0 #fff1d0, 0 -2px 0 #fff1d0, 2px 0 0 #fff1d0, -2px 0 0 #fff1d0; }
#tv-boot, #tv-boot-still { position: fixed; left: 0; top: 0; width: 100%; height: 100%; display: block; object-fit: cover; pointer-events: none; }
#tv-boot-still { transition: opacity .4s ease-out; } #tv-boot-still.out { opacity: 0; }
body.tv-bg3d #tv-title.mn { background: transparent; } body.tv-bg3d #tv-title .tv-deco { display: none; }
